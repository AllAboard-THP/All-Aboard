      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        passwordConfirmation:
          type: string
          minLength: 8
        fullName:
          type: string
          minLength: 1
        educationLevel:
          type: string
        headline:
          type: string
        acceptCgu:
          type: boolean
          const: true

    RegisterResponse:
      type: object
      required: [ok, userId, role]
      properties:
        ok:
          type: boolean
          const: true
        userId:
          type: string
          format: uuid
          description: users.id (JWT sub)
        role:
          $ref: "#/components/schemas/UserRole"

    LogoutResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    UserProfile:
      type: object
      required: [id, email, role, displayName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        displayName:
          type: string
        fullName:
          type: string
        headline:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
        educationLevel:
          type: string
        cguAcceptedAt:
          type: string
          format: date-time
        notifyOnComment:
          type: boolean
        notifyOnMessage:
          type: boolean
        certificationTags:
          type: array
          items:
            type: string
        competenceSubjects:
          type: array
          items:
            $ref: "#/components/schemas/SubjectSummary"
        createdAt:
          type: string
          format: date-time
        updatedAt:
