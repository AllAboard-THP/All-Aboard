        backedUp:
          type: boolean
        transports:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    PasskeyCredentialListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PasskeyCredentialSummary"

    AuthMeResponse:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
          description: users.id (JWT sub)
        role:
          $ref: "#/components/schemas/UserRole"
        displayName:
          type: string
        fullName:
          type: string
        headline:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
        educationLevel:
          type: string
        cguAcceptedAt:
          type: string
          format: date-time
        notifyOnComment:
