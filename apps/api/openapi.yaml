          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createDenylistPattern
      tags: [admin]
      summary: Ajouter un pattern denylist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDenylistPatternBody"
      responses:
        "201":
          description: Pattern créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDenylistPatternResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/denylist-patterns/{id}:
