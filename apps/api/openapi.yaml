          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rôle mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/subject-requests:
    get:
      operationId: listAdminSubjectRequests
      tags: [admin]
      summary: Files des demandes de matières
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Groupes par statut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubjectRequestsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/subject-requests/{id}:
    patch:
      operationId: updateAdminSubjectRequest
      tags: [admin]
      summary: Valider ou rejeter une demande de matière
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminSubjectRequestBody"
      responses:
        "200":
          description: Demande mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAdminSubjectRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT émis par POST /auth/login ou passkey (claim sub = users.id uuid)

  responses:
    Unauthorized:
      description: JWT absent ou invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Rôle admin requis
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Corps ou paramètres invalides
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Base indisponible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    UserRole:
      type: string
      enum: [student, mentor, admin]

    HelpRequest:
      type: object
      required: [id, title, authorId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        authorId:
          type: string
        authorProfileId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        body:
          type: string
        codeSnippet:
          type: string
        codeLanguage:
          type: string
        urgent:
          type: boolean
        status:
          type: string
          enum: [open, resolved]
        mentorHelpRequested:
          type: boolean
        subjectId:
          type: string
          format: uuid
        subject:
          $ref: "#/components/schemas/SubjectSummary"
        educationLevel:
          type: string
        aiSummary:
          type: string
        likesCount:
          type: integer
          minimum: 0
        responsesCount:
          type: integer
          minimum: 0
        bookmarksCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        flaggedForModeration:
          type: boolean
          description: |
            True si modération requise (regex/denylist + second avis Claude via agent).
            Masque l'entrée du fil public tant qu'un admin n'a pas approuvé.
        deletedAt:
          type: string
          format: date-time

    SubjectSummary:
      type: object
      required: [id, name, slug, icon, accentColor]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        accentColor:
          type: string

    Subject:
      allOf:
        - $ref: "#/components/schemas/SubjectSummary"
        - type: object
          required: [postsCount]
          properties:
            postsCount:
              type: integer
              minimum: 0
            description:
              type: string

    SubjectsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Subject"

    SubjectDetailResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/Subject"

    Response:
      type: object
      required: [id, helpRequestId, body, authorId]
      properties:
        id:
          type: string
          format: uuid
        helpRequestId:
          type: string
          format: uuid
        body:
          type: string
        authorId:
          type: string
        authorProfileId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        codeSnippet:
          type: string
        codeLanguage:
          type: string
        flaggedForModeration:
          type: boolean
          description: |
            True si modération requise (regex/denylist + second avis Claude via agent).
            Masque l'entrée du fil public tant qu'un admin n'a pas approuvé.

    FeedResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HelpRequest"
        pagination:
          type: object
          required: [page, limit, total]
          properties:
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
            total:
              type: integer
              minimum: 0
        widgets:
          type: object
          properties:
            unanswered:
              type: array
              items:
                $ref: "#/components/schemas/HelpRequest"

    MentorFeedResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MentorFeedItem"

    MentorFeedItem:
      allOf:
        - $ref: "#/components/schemas/HelpRequest"
        - type: object
          required: [responseCount, lastResponseAt, hasUnreadForMentor]
          properties:
            responseCount:
              type: integer
              minimum: 0
            lastResponseAt:
              type: string
              format: date-time
              nullable: true
            hasUnreadForMentor:
              type: boolean

    ResourceStatus:
      type: string
      enum: [pending, published, rejected]

    Resource:
      type: object
      required: [id, title, body, authorId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        authorId:
          type: string
        status:
          $ref: "#/components/schemas/ResourceStatus"
        subjectId:
          type: string
          format: uuid
        subject:
          $ref: "#/components/schemas/SubjectSummary"
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResourcesListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        pagination:
          $ref: "#/components/schemas/FeedPagination"

    ResourceDetailResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/Resource"

    CreateResourceBody:
      type: object
      required: [title, body, subjectId]
      properties:
        title:
          type: string
        body:
          type: string
        subjectId:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string

    UpdateResourceBody:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        subjectId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string

    CreateResourceResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/Resource"

    UpdateResourceResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/Resource"

    ApproveResourceResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/Resource"

    SubjectRequestStatus:
      type: string
      enum: [pending, approved, rejected]

    SubjectRequest:
      type: object
      required: [id, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/SubjectRequestStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSubjectRequestBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        description:
          type: string
          maxLength: 500

    CreateSubjectRequestResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/SubjectRequest"

    MentorDashboardStats:
      type: object
      required: [myResourcesCount, pendingResourcesCount, helpMentorQueueCount]
      properties:
        myResourcesCount:
          type: integer
          minimum: 0
        pendingResourcesCount:
          type: integer
          minimum: 0
        helpMentorQueueCount:
          type: integer
          minimum: 0

    MentorDashboardResponse:
      type: object
      required: [stats, myResources, pendingResources, helpMentorQueue]
      properties:
        stats:
          $ref: "#/components/schemas/MentorDashboardStats"
        myResources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        pendingResources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        helpMentorQueue:
          type: array
          items:
            $ref: "#/components/schemas/HelpRequest"

    HelpRequestDetailResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/HelpRequest"
        responses:
          type: array
          items:
            $ref: "#/components/schemas/Response"
        certificationFilter:
          type: object
          required: [applied, totalCount, visibleCount]
          properties:
            applied:
              type: boolean
              const: true
            totalCount:
              type: integer
              minimum: 0
            visibleCount:
              type: integer
              minimum: 0

    SuggestTagsBody:
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        body:
          type: string
          maxLength: 50000

    SuggestTagsResponse:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: string

    CreateHelpRequestBody:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        tags:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 64
        body:
          type: string
          maxLength: 50000
        codeSnippet:
          type: string
          maxLength: 50000
        codeLanguage:
          type: string
          maxLength: 64
        subjectId:
          type: string
          format: uuid
        urgent:
          type: boolean
        educationLevel:
          type: string
          maxLength: 64

    UpdateHelpRequestBody:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        body:
          type: string
          maxLength: 50000
        codeSnippet:
          type: string
          maxLength: 50000
          nullable: true
        codeLanguage:
          type: string
          maxLength: 64
        tags:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 64
        subjectId:
          type: string
          format: uuid
          nullable: true
        urgent:
          type: boolean
        status:
          type: string
          enum: [open, resolved]
        educationLevel:
          type: string
          maxLength: 64

    UpdateHelpRequestResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/HelpRequest"

    CreateHelpRequestResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/HelpRequest"
        hints:
          type: object
          description: >
            Présent si l'agent All-Aboard (`POST /routing/evaluate`, via `AGENT_URL`)
            suggère un handoff Rubberduck (service externe).
          properties:
            rubberduckEligible:
              type: boolean
              const: true

    CreateResponseBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000

    CreateResponseResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/Response"

    UpdateResponseBody:
      type: object
      minProperties: 1
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        codeSnippet:
          type: string
          maxLength: 50000
          nullable: true
        codeLanguage:
          type: string
          maxLength: 64

    UpdateResponseResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/Response"

    ToggleLikeResponse:
      type: object
      required: [liked, likesCount]
      properties:
        liked:
          type: boolean
        likesCount:
          type: integer
          minimum: 0
        item:
          $ref: "#/components/schemas/HelpRequest"

    ToggleBookmarkResponse:
      type: object
      required: [bookmarked, bookmarksCount]
      properties:
        bookmarked:
          type: boolean
        bookmarksCount:
          type: integer
          minimum: 0
        item:
          $ref: "#/components/schemas/HelpRequest"

    MyHelpRequestsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HelpRequest"

    LoginBody:
      type: object
      required: [password]
      properties:
        email:
          type: string
          format: email
          maxLength: 256
        userId:
          type: string
          description: Alias legacy dev (bob, alice) — ignoré en staging/prod
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          maxLength: 256
      oneOf:
        - required: [email]
        - required: [userId]

    LoginResponse:
      type: object
      required: [ok, userId, role]
      properties:
        ok:
          type: boolean
          const: true
        userId:
          type: string
          format: uuid
          description: users.id (JWT sub)
        role:
          $ref: "#/components/schemas/UserRole"

    PasskeyRegisterOptionsBody:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 256
        acceptCgu:
          type: boolean
          const: true

    PasskeyRegisterOptionsResponse:
      type: object
      required: [options]
      properties:
        options:
          type: object
          additionalProperties: true

    PasskeyRegisterVerifyResponse:
      type: object
      required: [ok, verified, userId, role]
      properties:
        ok:
          type: boolean
          const: true
        verified:
          type: boolean
          const: true
        userId:
          type: string
          format: uuid
          description: users.id (JWT sub)
        role:
          $ref: "#/components/schemas/UserRole"

    PasskeyLoginOptionsResponse:
      type: object
      required: [options]
      properties:
        options:
          type: object
          additionalProperties: true

    PasskeyLoginVerifyResponse:
      type: object
      required: [ok, verified, userId, role]
      properties:
        ok:
          type: boolean
          const: true
        verified:
          type: boolean
          const: true
        userId:
          type: string
          format: uuid
          description: users.id (JWT sub)
        role:
          $ref: "#/components/schemas/UserRole"

    PasskeyCredentialSummary:
