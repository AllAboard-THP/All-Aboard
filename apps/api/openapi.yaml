  /conversations/{id}/ws:
    get:
      operationId: subscribeConversationWebSocket
      tags: [conversations]
      summary: Abonnement WebSocket temps réel (messages)
      description: |
        Upgrade WebSocket (RFC 6455). Auth via cookie `access_token` ou query `?token=<JWT>`.
        Le serveur pousse des payloads `ChatMessage` JSON après chaque `POST …/messages`.
        Fermeture : `4401` non authentifié, `4403` non participant, `4503` base indisponible.
        Hub en mémoire — une instance API (mono-replica).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: JWT Bearer (alternative au cookie HttpOnly)
      responses:
        "101":
          description: Switching Protocols — flux `ChatMessage` JSON
        "401":
          description: JWT absent ou invalide
        "403":
          description: Non participant à la conversation

