      security:
        - bearerAuth: []
      responses:
        "200":
          description: Utilisateurs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/users/{id}/promote-admin:
    post:
      operationId: promoteAdminUser
      tags: [admin]
      summary: Promouvoir ou rétrograder un administrateur
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteAdminBody"
      responses:
        "200":
          description: Rôle mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
