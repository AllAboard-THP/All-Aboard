      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionApplicationDecisionBody"
      responses:
        "200":
          description: Décision enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`mission_full`, `mission_closed`, `application_withdrawn` ou `already_validated`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /missions/{id}/applications/{applicationId}/validate:
    parameters:
      - $ref: "#/components/parameters/MissionId"
      - $ref: "#/components/parameters/MissionApplicationId"
    post:
      operationId: validateMissionApplication
      tags: [missions]
      summary: Valider le travail d'un participant (certification d'expérience)
      description: |
        Auteur uniquement, candidature `accepted`. Une mission annulée ne valide que les participants
        qui ont un lien de livrable. Commentaire optionnel, modéré, hors chaîne. Au plus 50 validations
        par 24 heures. Enregistre un événement outbox `experience.attested` (ADR 0010 §4) et passe
        une mission `open` en `in_progress`. Une validation retirée puis redonnée est réactivée.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateMissionApplicationBody"
      responses:
        "201":
          description: Validation enregistrée (ou réactivée)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`application_not_accepted`, `mission_cancelled` ou `already_validated`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`comment_rejected`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: "`rate_limited`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /missions/{id}/applications/{applicationId}/validation:
    parameters:
      - $ref: "#/components/parameters/MissionId"
      - $ref: "#/components/parameters/MissionApplicationId"
    delete:
      operationId: withdrawMissionValidation
      tags: [missions]
      summary: Retirer une validation (auteur)
      description: Retrait dans Postgres uniquement. Une fois publiée, la validation reste sur la chaîne comme historique (ADR 0010 §5).
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Validation retirée
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /me/missions:
    get:
      operationId: listMyMissions
      tags: [missions]
      summary: Board du dashboard — mes missions et leurs candidatures (hors retirées)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Missions de l'auteur, plus récentes d'abord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMissionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/mission-applications:
    get:
      operationId: listMyMissionApplications
      tags: [missions]
      summary: Dashboard — mes candidatures
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Candidatures, plus récentes d'abord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMissionApplicationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}/experiences:
    get:
      operationId: listUserExperiences
      tags: [missions]
      summary: Certifications d'expérience d'un profil (non retirées)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Expériences, plus récentes d'abord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserExperiencesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT émis par POST /auth/login ou passkey (claim sub = users.id uuid)

  responses:
    Unauthorized:
      description: JWT absent ou invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Rôle admin requis
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Corps ou paramètres invalides
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Base indisponible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    MissionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MissionApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      required: [status, certificationPublisher]
      properties:
        status:
          type: string
          const: ok
        certificationPublisher:
          type: string
          enum: [on, "off"]
          description: Whether this API process publishes +1s on Intuition testnet.
        lowBalance:
          type: boolean
          description: Present once the publisher has read its wallet balance; true under 1 tTRUST.

    UserRole:
      type: string
      enum: [student, mentor, admin]

    HelpRequest:
      type: object
      required: [id, title, authorId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        authorId:
          type: string
        authorProfileId:
          type: string
          format: uuid
        authorDisplayName:
          type: string
          description: Display name of the registered author (full name, or derived from the email). Absent when author_id matches no user.
        createdAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        body:
          type: string
        codeSnippet:
          type: string
        codeLanguage:
          type: string
        urgent:
          type: boolean
        status:
          type: string
          enum: [open, resolved]
        mentorHelpRequested:
          type: boolean
        subjectId:
          type: string
          format: uuid
        subject:
          $ref: "#/components/schemas/SubjectSummary"
        educationLevel:
          type: string
        aiSummary:
          type: string
        likesCount:
          type: integer
          minimum: 0
        responsesCount:
          type: integer
          minimum: 0
        bookmarksCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        flaggedForModeration:
          type: boolean
          description: |
            True si modération requise (regex/denylist + second avis Claude via agent).
            Masque l'entrée du fil public tant qu'un admin n'a pas approuvé.
        deletedAt:
          type: string
          format: date-time

    SubjectSummary:
      type: object
      required: [id, name, slug, icon, accentColor]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        accentColor:
          type: string

    Subject:
      allOf:
        - $ref: "#/components/schemas/SubjectSummary"
        - type: object
          required: [postsCount]
          properties:
            postsCount:
              type: integer
              minimum: 0
            description:
              type: string

    SubjectsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Subject"

    SubjectDetailResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/Subject"

    Response:
      type: object
      required: [id, helpRequestId, body, authorId]
      properties:
        id:
          type: string
          format: uuid
        helpRequestId:
          type: string
          format: uuid
        body:
          type: string
        authorId:
          type: string
        authorProfileId:
          type: string
          format: uuid
        authorDisplayName:
          type: string
          description: Display name of the registered author (full name, or derived from the email). Absent when author_id matches no user.
        createdAt:
          type: string
          format: date-time
        codeSnippet:
          type: string
        codeLanguage:
          type: string
        flaggedForModeration:
          type: boolean
          description: |
            True si modération requise (regex/denylist + second avis Claude via agent).
            Masque l'entrée du fil public tant qu'un admin n'a pas approuvé.

    FeedResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
